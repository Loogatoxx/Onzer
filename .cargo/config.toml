# ═══════════════════════════════════════════════════════════════════════════
#  Le cache de compilation Rust vit sur le SSD externe, dans un volume APFS.
#
#  POURQUOI PAS SIMPLEMENT `target/` DANS LE PROJET ?
#  Le projet est sur un volume exFAT, sur lequel macOS écrit des fichiers
#  AppleDouble « ._* ». Le build script de Tauri parcourt les .toml de
#  `target/` et panique sur « ._default.toml », qui n'est pas de l'UTF-8.
#
#  POURQUOI PAS SUR LE DISQUE INTERNE ?
#  Un cache Rust/Tauri dépasse vite les 3 Go, et le disque interne est compté.
#  Le stockage volumineux doit rester sur le SSD.
#
#  LA SOLUTION : une image disque APFS posée sur le Lexar. Le stockage est
#  physiquement sur le SSD, mais le système de fichiers est natif — donc ni
#  fichiers AppleDouble, ni lenteurs exFAT sur les petits fichiers.
#  L'image est « sparse » : elle n'occupe que ce qui est réellement utilisé.
#
#  Le montage est automatique via `npm run app` (voir tools/build-cache/).
#  Si le volume n'est pas monté, Cargo recrée simplement un dossier vide à cet
#  endroit — d'où la vérification faite par le script avant chaque lancement.
# ═══════════════════════════════════════════════════════════════════════════
[build]
target-dir = "/Volumes/OnzerBuild/target"
