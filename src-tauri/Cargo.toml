[package]
name = "onzer"
version = "0.1.0"
description = "Lecteur musical 100% local et hors-ligne"
edition = "2021"
rust-version = "1.82"

[lib]
# `onzer_lib` contient toute la logique. Le binaire `main.rs` ne fait que
# l'appeler : c'est ce qui rend le cœur testable sans lancer l'application.
name = "onzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Le nom du binaire est celui qu'affiche le Dock de macOS **en développement**,
# où aucun paquet .app n'existe encore. Sans cette section, il vaudrait « onzer »
# — le nom du paquet Cargo, en minuscules.
[[bin]]
name = "Onzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Sérialisation — frontière IPC et champs JSON en base
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de données. `migrate` embarque les fichiers SQL dans le binaire :
# aucun fichier externe à déployer.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    # `macros` fournit `sqlx::migrate!`, qui embarque les fichiers SQL dans le
    # binaire à la compilation. Sans elle, la macro n'existe pas.
    "macros",
] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }

# Gestion d'erreurs
thiserror = "2"

# Journalisation structurée
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hash de contenu des fichiers audio (dédoublonnage et ré-identification)
blake3 = "1"

# Lecture et écriture des tags audio, pochettes incluses.
# Couvre MP3, FLAC, M4A/AAC, OGG et WAV avec une API unifiée.
lofty = "0.22.2"

# Parcours récursif de la bibliothèque
walkdir = "2.5.0"

# Normalisation des noms d'artistes et d'albums : décomposition NFD puis
# suppression des diacritiques, pour que « Beyoncé » et « Beyonce » se
# dédoublonnent.
unicode-normalization = "0.1.25"
# Redimensionnement des pochettes. Les fonctionnalités sont limitées aux
# formats réellement embarqués dans les fichiers audio : sans cela, le crate
# tire une trentaine de décodeurs inutiles et alourdit la compilation.
image = { version = "0.25.6", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
# Sélecteur de dossier natif macOS, pour choisir la racine de bibliothèque.
# La version doit rester alignée sur @tauri-apps/plugin-dialog côté npm.
tauri-plugin-dialog = "2.7"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
rustfft = "6.4.1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "vorbis", "ogg", "pcm", "wav", "aiff"] }
rusty-chromaprint = "0.3.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "gzip", "http2", "rustls", "charset"] }

# Le dossier de travail de la transcription : `whisper.cpp` veut un fichier
# WAV sur le disque, et un dossier temporaire qui se nettoie tout seul vaut
# mieux qu'un ménage à faire après chaque panne.
tempfile = "3"

# Les touches multimédia n'existent que sur un bureau : ce greffon n'a ni
# implémentation ni sens sur Android, et l'y embarquer casse la compilation
# pour cette cible.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"

[dev-dependencies]
# `test-util` donne le contrôle du temps dans les tests : une politique de
# limitation de débit se vérifie en microsecondes plutôt qu'en attendant
# réellement plusieurs secondes.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
# Vitesse et non taille. L'application passe l'essentiel de son temps de calcul
# dans l'analyse audio ; optimiser pour la taille y coûtait un facteur 10, pour
# économiser quelques mégaoctets de binaire sans intérêt.
opt-level = 3
panic = "abort"
strip = true

# Les dépendances sont optimisées **même en développement**.
#
# L'analyse audio passe l'essentiel de son temps dans `rustfft` et `symphonia`.
# Compilées sans optimisation, elles rendaient l'ouvrier dix fois plus lent,
# pour un gain de temps de compilation nul — ces crates ne changent jamais.
[profile.dev.package."*"]
opt-level = 3

# Notre propre code DSP mérite aussi un minimum d'optimisation en
# développement : le niveau 1 suffit à rendre l'analyse utilisable sans
# rallonger sensiblement les compilations.
[profile.dev]
opt-level = 1
